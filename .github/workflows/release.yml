name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: OpenMesh-windows-x64
          - os: macos-latest
            artifact: OpenMesh-macos-arm64
          - os: ubuntu-latest
            artifact: OpenMesh-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop]" pyinstaller
      - name: Build
        run: pyinstaller packaging/openmesh.spec --noconfirm
      - name: Pack Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/OpenMesh -DestinationPath ${{ matrix.artifact }}.zip
      - name: Pack macOS
        if: runner.os == 'macOS'
        run: |
          if [ -d dist/OpenMesh.app ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/OpenMesh.app ${{ matrix.artifact }}.zip
          else
            ditto -c -k --keepParent dist/OpenMesh ${{ matrix.artifact }}.zip
          fi
      - name: Pack Linux
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.artifact }}.tar.gz OpenMesh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenMesh</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/app.css" />
  <script>
    try {
      const p = JSON.parse(localStorage.getItem("openmesh.prefs") || "{}");
      document.documentElement.dataset.theme = p.theme === "dark" ? "dark" : "light";
      document.documentElement.lang = p.language === "zh" ? "zh-CN" : "en";
    } catch (e) {}
  </script>
</head>
<body>
  <aside class="sidebar">
    <div class="side-top">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" autocomplete="off" />
      </label>
      <div class="add-wrap">
        <button type="button" id="add-menu-btn" class="icon-btn" data-i18n-title="add">+</button>
        <div id="add-menu" class="menu hidden">
          <button type="button" id="add-agent" data-i18n="addTeammate">Add teammate</button>
          <button type="button" id="add-group" data-i18n="newGroup">New group</button>
        </div>
      </div>
    </div>
    <div id="agents" class="agent-list"></div>
    <div class="side-bottom">
      <button type="button" id="open-settings" class="userchip">
        <span class="avatar ink">OM</span>
        <span class="userchip-text">
          <b id="you-name">OpenMesh</b>
          <small data-i18n="settings">Settings</small>
        </span>
        <svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.1 12.9a7.6 7.6 0 0 0 .1-.9 7.6 7.6 0 0 0-.1-.9l2-1.6-1.9-3.3-2.4 1a7.2 7.2 0 0 0-1.6-.9l-.4-2.6h-3.8l-.4 2.6a7.2 7.2 0 0 0-1.6.9l-2.4-1-1.9 3.3 2 1.6a7.6 7.6 0 0 0-.1.9 7.6 7.6 0 0 0 .1.9l-2 1.6 1.9 3.3 2.4-1a7.2 7.2 0 0 0 1.6.9l.4 2.6h3.8l.4-2.6a7.2 7.2 0 0 0 1.6-.9l2.4 1 1.9-3.3-2-1.6Zm-7.1 2.3A3.2 3.2 0 1 1 15.2 12 3.2 3.2 0 0 1 12 15.2Z"/></svg>
      </button>
    </div>
  </aside>

  <main>
    <header class="chat-header">
      <span id="header-avatar" class="avatar">CH</span>
      <div id="header-faces" class="faces hidden"></div>
      <div class="chat-title">
        <h1 id="header-name">Chief</h1>
        <p id="header-sub"></p>
      </div>
      <select id="chat-model" class="model-pick" data-i18n-title="model"></select>
      <button type="button" id="stop-job" class="header-btn hidden" data-i18n="stop">Stop</button>
      <button type="button" id="manage-chat" class="header-btn hidden" data-i18n="manageGroup">Manage</button>
    </header>
    <div id="banner" class="banner hidden"></div>
    <section id="log" class="log">
      <div id="empty" class="empty"></div>
    </section>
    <form id="composer">
      <div class="pill">
        <div class="add-wrap">
          <button type="button" id="mention" class="icon-btn ghost" data-i18n-title="attach">+</button>
          <div id="mention-menu" class="menu up hidden"></div>
        </div>
        <input id="file-input" class="hidden" type="file" multiple />
        <textarea id="input" rows="1"></textarea>
        <button type="submit" id="send" class="send" data-i18n-title="send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.4 20.6 21 13.2c.8-.3.8-1.4 0-1.8L3.4 3.9c-.9-.4-1.8.5-1.5 1.4L4 11l8 1-8 1-2.1 5.7c-.3.9.6 1.8 1.5 1.4Z"/></svg>
        </button>
      </div>
    </form>
  </main>

  <section id="page-settings" class="page hidden" aria-hidden="true">
    <header class="page-header">
      <button type="button" class="back" id="close-settings" data-i18n="back">Back</button>
      <h2 data-i18n="settings">Settings</h2>
    </header>
    <div class="page-body">
      <section class="card">
        <h3 data-i18n="provider">Provider</h3>
        <div class="meta-row"><span data-i18n="status">Status</span><b id="key-status"></b></div>
        <div class="meta-row"><span data-i18n="model">Model</span><b id="key-model">—</b></div>
        <label for="api-key" data-i18n="apiKey">API key</label>
        <input id="api-key" type="password" autocomplete="off" />
        <label for="base-url" data-i18n="baseUrl">Base URL</label>
        <input id="base-url" type="text" />
        <label for="model" data-i18n="model">Model</label>
        <input id="model" type="text" />
        <button type="button" id="save-key" class="primary" data-i18n="saveLocally">Save locally</button>
        <p class="hint" data-i18n="keyHint"></p>
      </section>
      <section class="card">
        <h3 data-i18n="appearance">Appearance</h3>
        <label data-i18n="theme">Theme</label>
        <div class="seg" id="theme-seg">
          <button type="button" data-theme="light">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path fill="currentColor" d="M12 2.5a1 1 0 0 1 1 1V5a1 1 0 1 1-2 0V3.5a1 1 0 0 1 1-1Zm0 14.5a1 1 0 0 1 1 1v1.5a1 1 0 1 1-2 0V18a1 1 0 0 1 1-1ZM3.5 11a1 1 0 0 0 0 2H5a1 1 0 1 0 0-2H3.5Zm14.5 0a1 1 0 1 0 0 2h1.5a1 1 0 1 0 0-2H18ZM5.6 5.6a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1-1.4 1.4L5.6 7A1 1 0 0 1 5.6 5.6Zm10.3 10.3a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 1 1-1.4 1.4l-1.1-1.1a1 1 0 0 1 0-1.4ZM18.4 5.6A1 1 0 0 1 18.4 7l-1.1 1.1a1 1 0 1 1-1.4-1.4l1.1-1.1a1 1 0 0 1 1.4 0ZM7 16.9a1 1 0 0 1 0 1.4l-1.1 1.1A1 1 0 0 1 4.5 18l1.1-1.1A1 1 0 0 1 7 16.9Z"/></svg>
            <span data-i18n="light">Light</span>
          </button>
          <button type="button" data-theme="dark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.2 3.1a1 1 0 0 1 1.1 1.4A8 8 0 1 0 19.5 17a1 1 0 0 1 1.7.9 10 10 0 1 1-7.4-15.4 1 1 0 0 1 1.4.6Z"/></svg>
            <span data-i18n="dark">Dark</span>
          </button>
        </div>
        <label data-i18n="language">Language</label>
        <div class="seg" id="lang-seg">
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="zh">中文</button>
        </div>
      </section>
      <section class="card">
        <h3 data-i18n="schedules">Schedules</h3>
        <p class="hint" data-i18n="scheduleHint"></p>
        <label for="sched-title" data-i18n="title">Title</label>
        <input id="sched-title" />
        <label for="sched-text" data-i18n="scheduleText">Message</label>
        <textarea id="sched-text" rows="3"></textarea>
        <label for="sched-every" data-i18n="everyMinutes">Every (minutes)</label>
        <input id="sched-every" type="text" inputmode="numeric" />
        <label for="sched-cron" data-i18n="cron">Or cron (m h dom mon dow)</label>
        <input id="sched-cron" />
        <button type="button" id="save-schedule" class="primary" data-i18n="addSchedule">Add schedule</button>
        <div id="schedule-list" class="schedule-list"></div>
      </section>
      <section class="card">
        <h3 data-i18n="thisChat">This chat</h3>
        <button type="button" id="clear-room" class="ghost-btn" data-i18n="clearChat">Clear this chat</button>
      </section>
    </div>
  </section>

  <section id="page-editor" class="page hidden" aria-hidden="true">
    <header class="page-header">
      <button type="button" class="back" id="close-editor" data-i18n="back">Back</button>
      <h2 id="editor-title" data-i18n="newTeammate">New teammate</h2>
    </header>
    <div class="page-body">
      <form id="agent-form" class="card">
        <input type="hidden" id="edit-id" />
        <label for="agent-name" data-i18n="name">Name</label>
        <input id="agent-name" required />
        <label for="agent-slug" data-i18n="id">ID</label>
        <input id="agent-slug" />
        <p class="hint" id="id-hint" data-i18n="idHint"></p>
        <label for="agent-color" data-i18n="color">Color</label>
        <input id="agent-color" type="color" value="#5B8DEF" />
        <label for="agent-role" data-i18n="role">Role</label>
        <textarea id="agent-role" rows="5"></textarea>
        <label data-i18n="tools">Tools</label>
        <div id="tool-list" class="tool-list"></div>
        <div class="row-actions">
          <button type="submit" class="primary" data-i18n="saveTeammate">Save teammate</button>
          <button type="button" id="delete-agent" class="danger hidden" data-i18n="deleteTeammate">Delete</button>
        </div>
      </form>
    </div>
  </section>

  <section id="page-group" class="page hidden" aria-hidden="true">
    <header class="page-header">
      <button type="button" class="back" id="close-group" data-i18n="back">Back</button>
      <h2 id="group-title-label">New group</h2>
    </header>
    <div class="page-body">
      <form id="group-form" class="card">
        <input type="hidden" id="group-id" />
        <label for="group-name" data-i18n="groupName">Group name</label>
        <input id="group-name" />
        <label data-i18n="members">Members</label>
        <p class="hint" data-i18n="membersHint"></p>
        <div id="member-list" class="tool-list"></div>
        <div class="row-actions">
          <button type="submit" class="primary" data-i18n="saveGroup">Save group</button>
          <button type="button" id="delete-group" class="danger hidden" data-i18n="deleteGroup">Delete group</button>
        </div>
      </form>
    </div>
  </section>

  <section id="page-doc" class="page hidden" aria-hidden="true">
    <header class="page-header">
      <button type="button" class="back" id="close-doc" data-i18n="back">Back</button>
      <h2 data-i18n="newDoc">New document</h2>
    </header>
    <div class="page-body">
      <form id="doc-form" class="card">
        <label for="doc-title" data-i18n="docTitle">Title</label>
        <input id="doc-title" required />
        <label for="doc-body" data-i18n="docBody">Document</label>
        <textarea id="doc-body" rows="16"></textarea>
        <button type="submit" class="primary" data-i18n="saveDoc">Save to this chat</button>
      </form>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>

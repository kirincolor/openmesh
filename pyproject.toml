[project]
name = "openmesh"
version = "0.2.2"
description = "Local multi-agent workspace you can download and run: chats, tools, skills, and your APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "openmesh contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "platformdirs>=4.0.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-pptx>=1.0.0",
]

[project.scripts]
openmesh = "openmesh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
desktop = ["pywebview>=5.1"]

[tool.setuptools.package-data]
openmesh = ["static/*"]
